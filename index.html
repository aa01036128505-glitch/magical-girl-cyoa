<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17102c"><title>마법소녀 등장 | Static CYOA</title><style>
:root{font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif;color:#f8f0ff;background:#110e20}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#46305d 0%,#171127 48%,#0e0b19 100%);min-height:100vh}button{font:inherit;cursor:pointer}.wrap{max-width:950px;margin:auto;padding:24px 17px 100px}.hero{text-align:center;padding:58px 15px 38px}.eyebrow{color:#eac1ff;letter-spacing:.28em;font-size:.8rem}.hero h1{font-family:Georgia,'Noto Serif KR',serif;font-size:clamp(2.5rem,8vw,4.8rem);margin:15px 0;background:linear-gradient(90deg,#ffb7de,#fff0ff,#c6b5ff);color:transparent;background-clip:text}.hero p{color:#e2d6ef;line-height:1.8}.stars{font-size:2rem;color:#ffcced}.status{position:sticky;top:8px;z-index:10;background:#211831ef;border:1px solid #775d91;border-radius:18px;padding:15px 19px;backdrop-filter:blur(12px);box-shadow:0 8px 30px #0005;display:flex;gap:18px;align-items:center;justify-content:space-between}.status strong{font-size:1.55rem;color:#ffd1ee}.status small{display:block;color:#c8b7d9}.bar{height:8px;background:#493653;border-radius:20px;overflow:hidden;flex:1;max-width:260px}.fill{height:100%;width:0;background:linear-gradient(90deg,#d88afc,#ff99c8);transition:width .2s}.section{margin-top:32px}.section h2{font-size:1.55rem;margin:0 0 8px}.section p{color:#c9b8d6;line-height:1.65;margin:0 0 18px}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.option{background:linear-gradient(145deg,#30223f,#211a34);border:1px solid #655076;border-radius:16px;color:#f8f1ff;text-align:left;padding:18px;min-height:116px;transition:.15s;display:flex;flex-direction:column;gap:9px}.option:hover{border-color:#f1a4dc;transform:translateY(-2px)}.option.selected{border:2px solid #ffb0e1;background:linear-gradient(140deg,#603458,#392451);box-shadow:0 0 0 2px #f6b4e120}.option .top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:750}.cost{background:#563768;border-radius:99px;padding:5px 10px;color:#ffd5f2;white-space:nowrap}.desc{color:#d4c5dd;font-size:.91rem;line-height:1.55}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.primary,.secondary{border-radius:12px;padding:14px 20px;font-weight:750;border:1px solid #b987d4}.primary{background:linear-gradient(100deg,#f6a1d0,#c7a2ff);color:#24132f}.secondary{background:#2c213c;color:#f4e5ff}.primary:disabled{opacity:.4;cursor:not-allowed}.notice{color:#ffb3c6;min-height:24px}.result{display:none;margin-top:25px;padding:24px;background:#271d39;border:1px solid #b88ac6;border-radius:20px}.result.visible{display:block}.result h2{color:#ffcae9;margin-top:0}.result pre{white-space:pre-wrap;line-height:1.9;font-family:inherit}.foot{text-align:center;margin-top:48px;color:#aa9bbd;font-size:.8rem}@media(max-width:540px){.status{gap:9px;padding:12px}.bar{max-width:80px}.options{grid-template-columns:1fr}.hero{padding-top:35px}}
</style></head><body><main class="wrap"><header class="hero"><div class="stars">✧ ☾ ✦</div><div class="eyebrow">STATIC CYOA · 15 POINTS</div><h1>마법소녀 등장</h1><p>당신에게 마법소녀가 될 기회가 주어졌다.<br>어떤 모습으로 세상에 등장할 것인가?</p></header><div class="status" aria-live="polite"><div><small>사용 포인트</small><strong id="used">0 / 15P</strong></div><div class="bar"><div id="fill" class="fill"></div></div><div><small>남은 포인트</small><strong id="left">15P</strong></div></div><div id="sections"></div><div class="actions"><button class="primary" id="finish" disabled>✦ 마법소녀 완성하기</button><button class="secondary" id="reset">처음부터 다시 선택</button></div><p class="notice" id="notice" aria-live="polite"></p><section class="result" id="result"><h2>✦ 나의 마법소녀 ✦</h2><pre id="summary"></pre><div class="actions"><button class="primary" id="copy">결과 복사하기</button><button class="secondary" id="share">공유 링크 복사하기</button></div><p id="copyStatus" aria-live="polite"></p></section><footer class="foot">마법소녀 등장 · Static CYOA · 시작 포인트 15P</footer></main><script>
const groups=[{title:'마스코트',intro:'당신을 마법소녀로 이끌어 줄 조력자.',items:[['사기꾼','계약의 함정이 숨어 있을 수 있는 수상한 마스코트.'],['무허가','정식 관리 체계 밖에 있어 지원이 부족하지만 간섭도 적다.'],['정식','표준적인 계약과 교육 및 지원을 제공한다.'],['엘리트','고급 마법 지식과 우수한 지원을 제공한다.'],['베테랑','수많은 사건을 겪은 노련한 조력자.']]},{title:'변신방법',intro:'마법소녀로 변신하기 위한 조건.',items:[['엄청 긴 영창','3줄 이상의 영창을 중간에 틀리지 않고 끝까지 읊어야 한다.'],['도구나 아이템','지정된 변신 도구 또는 아이템을 사용한다.'],['포즈','정해진 변신 포즈를 정확히 취한다.'],['「변신」이라고 말하기','변신을 말로 선언한다.'],['자신의 의지로','별도의 영창, 도구, 포즈 없이 의지만으로 변신한다.']]},{title:'장비',intro:'변신 후 착용하게 되는 의상.',items:[['수영복','가볍지만 보호 기능은 기대하기 어려운 복장.'],['직업복','교복, 군복, 간호사복 등 역할을 상징하는 복장.'],['마법소녀복','리본과 프릴 등 전통적인 마법소녀 의상.'],['개성이 넘치는 나만의 드레스','취향과 개성을 담아 만들어진 전용 의상.'],['각성! 웨딩드레스','각성의 상징인 특별한 웨딩드레스.']]},{title:'마나',intro:'보유한 마나의 양과 성질.',items:[['일반인','마나가 없거나 극히 미미하다.'],['조금','마법을 사용할 수 있지만 출력과 지속력이 낮다.'],['평균','일반적인 마법소녀 수준의 마나.'],['대마법사','막대한 마나를 보유한다.'],['마녀','마나의 양이나 성질이 비정상적이다.']]},{title:'잠재력',intro:'앞으로 얼마나 성장할 수 있는가?',items:[['패급','성장 가능성이 매우 낮다.'],['빛 좋은 개살구','겉보기와 달리 성장성이 부족하다.'],['평균','평범한 성장 가능성.'],['유망주','경험과 훈련에 따라 크게 성장할 수 있다.'],['초인','인간의 한계를 넘어서는 성장 가능성.']]}];
const selected=Array(5).fill(-1),sections=document.getElementById('sections');function render(){sections.innerHTML='';groups.forEach((g,i)=>{const sec=document.createElement('section');sec.className='section';const h=document.createElement('h2');h.textContent=`0${i+1} ✦ ${g.title}`;const p=document.createElement('p');p.textContent=g.intro;const opts=document.createElement('div');opts.className='options';g.items.forEach(([name,desc],j)=>{const b=document.createElement('button');b.type='button';b.className='option'+(selected[i]===j?' selected':'');b.setAttribute('aria-pressed',selected[i]===j?'true':'false');const top=document.createElement('span');top.className='top';const label=document.createElement('span');label.textContent=name;const cost=document.createElement('span');cost.className='cost';cost.textContent=`${j+1}P`;top.append(label,cost);const d=document.createElement('span');d.className='desc';d.textContent=desc;b.append(top,d);b.onclick=()=>{selected[i]=j;document.getElementById('result').classList.remove('visible');render();};opts.append(b)});sec.append(h,p,opts);sections.append(sec)});const total=selected.reduce((s,v)=>s+(v>=0?v+1:0),0);document.getElementById('used').textContent=`${total} / 15P`;document.getElementById('left').textContent=`${15-total}P`;document.getElementById('fill').style.width=`${Math.min(100,total/15*100)}%`;document.getElementById('fill').style.background=total>15?'#ff668c':'';document.getElementById('finish').disabled=total>15||selected.includes(-1);document.getElementById('notice').textContent=total>15?`${total-15}P를 초과했어요. 다른 선택지를 골라 주세요.`:selected.includes(-1)?'각 항목에서 하나씩 선택해 주세요.':'모든 항목을 선택했어요! 결과를 확인해 보세요.'}
function resultText(){const total=selected.reduce((s,v)=>s+v+1,0);return '✦ 마법소녀 등장 ✦\n'+groups.map((g,i)=>`${g.title}: ${g.items[selected[i]][0]} (${selected[i]+1}P)`).join('\n')+`\n사용 포인트: ${total}/15P\n남은 포인트: ${15-total}P`}
async function copyText(value){try{await navigator.clipboard.writeText(value);return true}catch{const t=document.createElement('textarea');t.value=value;document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();return ok}}
document.getElementById('finish').onclick=()=>{document.getElementById('summary').textContent=resultText();document.getElementById('result').classList.add('visible');document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'})};document.getElementById('reset').onclick=()=>{selected.fill(-1);history.replaceState(null,'',location.pathname);document.getElementById('result').classList.remove('visible');render();window.scrollTo({top:0,behavior:'smooth'})};document.getElementById('copy').onclick=async()=>{document.getElementById('copyStatus').textContent=await copyText(resultText())?'결과를 복사했어요!':'복사에 실패했어요.'};document.getElementById('share').onclick=async()=>{const url=new URL(location.href);url.searchParams.set('build',selected.map(x=>x+1).join(''));document.getElementById('copyStatus').textContent=await copyText(url.toString())?'선택 결과를 담은 링크를 복사했어요!':'링크 복사에 실패했어요.'};const build=new URLSearchParams(location.search).get('build');if(build&&/^[1-5]{5}$/.test(build)){[...build].forEach((n,i)=>selected[i]=Number(n)-1)}render();
</script></body></html>
